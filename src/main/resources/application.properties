# ---------------------------------------------------------------------------
# Hexagonal demo configuration
# ---------------------------------------------------------------------------

# Selects which outbound adapter implements the TaskRepository port.
#   memory -> in-memory adapter (zero config, good for learning and tests)
#   jpa    -> the same port implemented on top of Hibernate Panache + H2
# Changing this value requires a build/restart (it is resolved at build time).
app.persistence=memory

# In-memory H2 database used by the JPA adapter. It is started on JVM/native mode
# so that Hibernate always has a datasource available, regardless of the adapter
# selected above.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.database.generation=drop-and-create

%prod.quarkus.http.port=8080